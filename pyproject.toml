[project]
dependencies = [
    "construct-typing>=0.5.1,<0.7",
    "solana>=0.36.1,<1.0",
    "solders>=0.21.0,<1.0",
    "borsh-construct>=0.1.0,<0.2",
    "toolz>=0.11.2,<0.12",
    "pyheck>=0.1.4,<0.2",
    "based58>=0.1.1,<0.2",
    "toml>=0.10.2,<0.11",
    "typer>=0.16.0",
    "typing_extensions>=4.8.0",
    "anchorpy-idl @ git+https://github.com/bonlime/anchorpy-idl.git@fix-init",
    # "anchorpy-idl @ /Users/zakirove/repoz/anchorpy-idl-bonlime",
    "msgspec>=0.20.0",
    "ruff",
]
name = "anchorpy"
version = "0.22.6"
description = "The Python Anchor client."
authors = [{ name = "kevinheavey", email = "kevinheavey123@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
cli = ["ipython>=8.18.0,<9"]
pytest = ["pytest>=8.0.0,<9", "pytest-asyncio>=1.1.0", "pytest-xprocess>=1.0.2"]

[project.urls]
Repository = "https://github.com/kevinheavey/anchorpy"
Documentation = "https://kevinheavey.github.io/anchorpy/"

[project.scripts]
anchorpy = "anchorpy.cli:app"

[project.entry-points.pytest11]
pytest_anchorpy = "anchorpy.pytest_plugin"

[dependency-groups]
dev = [
    "mypy>=0.982,<0.983",
    "jinja2==3.0.3",
    "mkdocs-material>=8.1.7,<9",
    "bump2version>=1.0.1,<2",
    "mkdocstrings>=0.17.0,<0.18",
    "pytest>=8.0.0,<9",
    # "pytest-asyncio>=0.21.0,<0.22",
    "pytest-xprocess>=1.0.2",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]


# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
ignore = ["B023", "D100", "D101", "D102", "D103", "D104", "D107", "D203"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

select = [
    "A",
    "B",
    "D",
    "E",
    "F",
    "I",
    "ARG",
    "BLE",
    "C4",
    "SIM",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "RUF",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/anchorpy/__init__.py" = ["F401"]
"src/anchorpy/coder/*.py" = ["ARG002"]
"src/anchorpy/borsh_extension.py" = ["ARG002"]
"tests/**/*.py" = ["ARG001", "E501"]
"tests/client_gen/example_program_gen/**/*.py" = ["C417", "I001", "F401"]
"tests/client_gen/token/**/*.py" = ["C417", "I001", "F401"]
"src/anchorpy/cli.py" = ["B008"]

[tool.ty.rules]
index-out-of-bounds = "ignore"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = ["src"]
exclude = [".venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
